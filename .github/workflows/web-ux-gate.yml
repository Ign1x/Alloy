name: Web UX Gate

on:
  pull_request:
    paths:
      - 'web/**'
      - '.github/workflows/web-ux-gate.yml'
      - 'goals/uiux-top10-redesign-plan.md'
      - 'goals/web-ux-250-updates-ulw.md'
      - 'web/ux-quality-checklist.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ux-gate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build

      - name: Bundle budget check
        run: npm run bundle:check

      - name: Lighthouse CI (desktop)
        run: |
          npx --yes @lhci/cli@0.15.x autorun --config=.lighthouserc.json
          rm -rf .lighthouseci-desktop
          mv .lighthouseci .lighthouseci-desktop

      - name: Lighthouse CI (mobile)
        run: |
          npx --yes @lhci/cli@0.15.x autorun --config=.lighthouserc.mobile.json
          rm -rf .lighthouseci-mobile
          mv .lighthouseci .lighthouseci-mobile

      - name: Upload Lighthouse artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-lighthouse-report
          path: |
            web/.lighthouseci-desktop
            web/.lighthouseci-mobile

      - name: Publish UX checklist in summary
        if: always()
        run: |
          {
            echo '## UX quality checklist (Thread J)'
            echo
            echo '- [x] J02 Build gate executed in CI (`npm run build`)'
            echo '- [x] J23 Bundle budget review executed in CI (`npm run bundle:check`)'
            echo '- [x] Lighthouse desktop + mobile checks executed in CI (accessibility enforced)'
            echo '- [ ] J03/J04 Key page walkthrough (desktop + mobile)'
            echo '- [ ] J05-J10 Core flow walkthrough coverage'
            echo '- [ ] J11-J22 Content/a11y/interaction/perf manual checks'
            echo '- [ ] J24 Multi-language smoke check'
            echo '- [ ] J25 Release sign-off record archived in `web/ux-release-archive/`'
            echo
            echo 'Reference: web/ux-quality-checklist.md'
          } >> "$GITHUB_STEP_SUMMARY"

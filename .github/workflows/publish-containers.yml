name: Publish Containers

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (vX.Y.Z)"
        required: true
        type: string
      publish_dockerhub:
        description: "Also publish DockerHub mirror (requires secrets)"
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

permissions:
  contents: write
  packages: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      channel: ${{ steps.meta.outputs.channel }}
      push_latest: ${{ steps.meta.outputs.push_latest }}
      release_url: ${{ steps.meta.outputs.release_url }}
      publish_dockerhub: ${{ steps.meta.outputs.publish_dockerhub }}
      dockerhub_namespace: ${{ steps.meta.outputs.dockerhub_namespace }}
      control_version: ${{ steps.meta.outputs.control_version }}
      agent_version: ${{ steps.meta.outputs.agent_version }}
      control_tag: ${{ steps.meta.outputs.control_tag }}
      agent_tag: ${{ steps.meta.outputs.agent_tag }}
    steps:
      - uses: actions/checkout@v4

      - id: meta
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
          INPUT_PUBLISH_DOCKERHUB: ${{ github.event.inputs.publish_dockerhub }}
          REPOSITORY: ${{ github.repository }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          DOCKERHUB_NAMESPACE_SECRET: ${{ secrets.DOCKERHUB_NAMESPACE }}
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            tag="${INPUT_TAG:-}"
            dispatch_publish="${INPUT_PUBLISH_DOCKERHUB:-true}"
          else
            tag="${REF_NAME}"
            dispatch_publish="true"
          fi

          if [ -z "$tag" ]; then
            echo "Release tag is required (for example: v0.2.3)." >&2
            exit 1
          fi

          if ! printf '%s' "$tag" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$'; then
            echo "Invalid tag format: $tag" >&2
            exit 1
          fi

          channel="stable"
          push_latest="true"
          if printf '%s' "$tag" | grep -Eq '[-+]'; then
            channel="prerelease"
            push_latest="false"
          fi

          control_version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' crates/alloy-control/Cargo.toml | head -n1)"
          agent_version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' crates/alloy-agent/Cargo.toml | head -n1)"
          if [ -z "$control_version" ] || [ -z "$agent_version" ]; then
            echo "Failed to detect control/agent versions from Cargo.toml" >&2
            exit 1
          fi

          control_tag="v${control_version}"
          agent_tag="v${agent_version}"

          dockerhub_namespace="${DOCKERHUB_NAMESPACE_SECRET:-${DOCKERHUB_USERNAME:-}}"
          dockerhub_namespace="$(printf '%s' "$dockerhub_namespace" | tr -d '[:space:]')"

          valid_dockerhub_namespace="false"
          if [ -n "$dockerhub_namespace" ] && printf '%s' "$dockerhub_namespace" | grep -Eq '^[a-z0-9]+([._-][a-z0-9]+)*$'; then
            valid_dockerhub_namespace="true"
          fi

          have_dockerhub="false"
          if [ -n "${DOCKERHUB_USERNAME:-}" ] && [ -n "${DOCKERHUB_TOKEN:-}" ] && [ "$valid_dockerhub_namespace" = "true" ]; then
            have_dockerhub="true"
          fi

          publish_dockerhub="false"
          if [ "$dispatch_publish" = "true" ] && [ "$have_dockerhub" = "true" ]; then
            publish_dockerhub="true"
          fi

          release_url="https://github.com/${REPOSITORY}/releases/tag/${tag}"

          {
            echo "tag=$tag"
            echo "channel=$channel"
            echo "push_latest=$push_latest"
            echo "release_url=$release_url"
            echo "publish_dockerhub=$publish_dockerhub"
            echo "dockerhub_namespace=$dockerhub_namespace"
            echo "control_version=$control_version"
            echo "agent_version=$agent_version"
            echo "control_tag=$control_tag"
            echo "agent_tag=$agent_tag"
          } >> "$GITHUB_OUTPUT"

  build-and-publish:
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image_name: alloy-agent
            dockerfile: deploy/agent.Dockerfile
          - image_name: alloy-control
            dockerfile: deploy/control.Dockerfile
          - image_name: alloy-web
            dockerfile: deploy/web.Dockerfile

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to DockerHub (optional mirror)
        if: needs.prepare.outputs.publish_dockerhub == 'true'
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - id: tags
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
          PUSH_LATEST: ${{ needs.prepare.outputs.push_latest }}
          PUBLISH_DOCKERHUB: ${{ needs.prepare.outputs.publish_dockerhub }}
          DOCKERHUB_NAMESPACE: ${{ needs.prepare.outputs.dockerhub_namespace }}
          CONTROL_TAG: ${{ needs.prepare.outputs.control_tag }}
          AGENT_TAG: ${{ needs.prepare.outputs.agent_tag }}
          IMAGE_NAME: ${{ matrix.image_name }}
        run: |
          set -euo pipefail
          owner_lc="$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
          dockerhub_namespace="$(printf '%s' "${DOCKERHUB_NAMESPACE:-}" | tr -d '[:space:]')"

          component_tag="$TAG"
          if [ "$IMAGE_NAME" = "alloy-control" ]; then
            component_tag="$CONTROL_TAG"
          elif [ "$IMAGE_NAME" = "alloy-agent" ]; then
            component_tag="$AGENT_TAG"
          fi

          tags="ghcr.io/${owner_lc}/${IMAGE_NAME}:${TAG}"
          tags="${tags}"$'\n'"ghcr.io/${owner_lc}/${IMAGE_NAME}:${component_tag}"
          if [ "$PUSH_LATEST" = "true" ]; then
            tags="${tags}"$'\n'"ghcr.io/${owner_lc}/${IMAGE_NAME}:latest"
          fi

          if [ "$PUBLISH_DOCKERHUB" = "true" ] && [ -n "$dockerhub_namespace" ]; then
            tags="${tags}"$'\n'"${dockerhub_namespace}/${IMAGE_NAME}:${TAG}"
            tags="${tags}"$'\n'"${dockerhub_namespace}/${IMAGE_NAME}:${component_tag}"
            if [ "$PUSH_LATEST" = "true" ]; then
              tags="${tags}"$'\n'"${dockerhub_namespace}/${IMAGE_NAME}:latest"
            fi
          fi

          tags="$(printf '%s\n' "$tags" | awk 'NF && !seen[$0]++')"

          {
            echo "value<<EOF"
            echo "$tags"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push ${{ matrix.image_name }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.tags.outputs.value }}
          labels: |
            org.opencontainers.image.title=${{ matrix.image_name }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.prepare.outputs.tag }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  publish-manifest-asset:
    needs:
      - prepare
      - build-and-publish
    runs-on: ubuntu-latest
    steps:
      - name: Generate update manifest
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
          CHANNEL: ${{ needs.prepare.outputs.channel }}
          RELEASE_URL: ${{ needs.prepare.outputs.release_url }}
          PUBLISH_DOCKERHUB: ${{ needs.prepare.outputs.publish_dockerhub }}
          DOCKERHUB_NAMESPACE: ${{ needs.prepare.outputs.dockerhub_namespace }}
          CONTROL_VERSION: ${{ needs.prepare.outputs.control_version }}
          AGENT_VERSION: ${{ needs.prepare.outputs.agent_version }}
          CONTROL_TAG: ${{ needs.prepare.outputs.control_tag }}
          AGENT_TAG: ${{ needs.prepare.outputs.agent_tag }}
        run: |
          set -euo pipefail

          owner_lc="$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
          published_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          control_major_minor="$(printf '%s' "$CONTROL_VERSION" | awk -F. '{print $1 "." $2}')"
          dockerhub_namespace="$(printf '%s' "${DOCKERHUB_NAMESPACE:-}" | tr -d '[:space:]')"

          ghcr_control="ghcr.io/${owner_lc}/alloy-control:${CONTROL_TAG}"
          ghcr_agent="ghcr.io/${owner_lc}/alloy-agent:${AGENT_TAG}"

          dockerhub_control=""
          dockerhub_agent=""
          if [ "$PUBLISH_DOCKERHUB" = "true" ] && [ -n "$dockerhub_namespace" ]; then
            dockerhub_control="${dockerhub_namespace}/alloy-control:${CONTROL_TAG}"
            dockerhub_agent="${dockerhub_namespace}/alloy-agent:${AGENT_TAG}"
          fi

          jq -n \
            --arg channel "$CHANNEL" \
            --arg published_at "$published_at" \
            --arg release_url "$RELEASE_URL" \
            --arg control_tag "$CONTROL_TAG" \
            --arg control_version "$CONTROL_VERSION" \
            --arg agent_tag "$AGENT_TAG" \
            --arg agent_version "$AGENT_VERSION" \
            --arg ghcr_control "$ghcr_control" \
            --arg ghcr_agent "$ghcr_agent" \
            --arg dockerhub_control "$dockerhub_control" \
            --arg dockerhub_agent "$dockerhub_agent" \
            --arg control_major_minor "$control_major_minor" \
            '{
              schema: 1,
              channel: $channel,
              published_at: $published_at,
              control: {
                tag: $control_tag,
                version: $control_version,
                url: $release_url,
                images: {
                  ghcr: $ghcr_control,
                  dockerhub: (if $dockerhub_control == "" then null else $dockerhub_control end)
                }
              },
              agent: {
                tag: $agent_tag,
                version: $agent_version,
                url: $release_url,
                images: {
                  ghcr: $ghcr_agent,
                  dockerhub: (if $dockerhub_agent == "" then null else $dockerhub_agent end)
                }
              },
              compatibility: {
                control_min_agent: ($control_major_minor + ".0"),
                control_max_agent: ($control_major_minor + ".x"),
                note: ("Control and agent in the same minor series are recommended (control " + $control_major_minor + ".x).")
            }
          }' > update-manifest.json

      - name: Generate release notes (bilingual)
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
          CONTROL_VERSION: ${{ needs.prepare.outputs.control_version }}
          AGENT_VERSION: ${{ needs.prepare.outputs.agent_version }}
          CONTROL_TAG: ${{ needs.prepare.outputs.control_tag }}
          AGENT_TAG: ${{ needs.prepare.outputs.agent_tag }}
          PUBLISH_DOCKERHUB: ${{ needs.prepare.outputs.publish_dockerhub }}
          DOCKERHUB_NAMESPACE: ${{ needs.prepare.outputs.dockerhub_namespace }}
        run: |
          set -euo pipefail

          owner_lc="$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
          dockerhub_namespace="$(printf '%s' "${DOCKERHUB_NAMESPACE:-}" | tr -d '[:space:]')"

          cat > release-notes.md <<EOF
          ## Release Notes / 更新日志

          This release updates core capabilities across agent/control/web and refreshes delivery metadata.
          本次发布更新了 agent/control/web 的核心能力，并同步刷新了发布元数据。

          ### Component Versions / 组件版本

          - \\`alloy-control\\`: \\`${CONTROL_VERSION}\\` (tag: \\`${CONTROL_TAG}\\`)
          - \\`alloy-agent\\`: \\`${AGENT_VERSION}\\` (tag: \\`${AGENT_TAG}\\`)

          ### Images / 镜像

          - GHCR
            - \\`ghcr.io/${owner_lc}/alloy-control:${CONTROL_TAG}\\`
            - \\`ghcr.io/${owner_lc}/alloy-agent:${AGENT_TAG}\\`
            - \\`ghcr.io/${owner_lc}/alloy-web:${TAG}\\`
          EOF

          if [ "$PUBLISH_DOCKERHUB" = "true" ] && [ -n "$dockerhub_namespace" ]; then
            cat >> release-notes.md <<EOF
          - DockerHub mirror / DockerHub 镜像站
            - \\`${dockerhub_namespace}/alloy-control:${CONTROL_TAG}\\`
            - \\`${dockerhub_namespace}/alloy-agent:${AGENT_TAG}\\`
            - \\`${dockerhub_namespace}/alloy-web:${TAG}\\`
          EOF
          else
            cat >> release-notes.md <<EOF
          - DockerHub mirror / DockerHub 镜像站
            - Not published in this run / 本次发布未同步
          EOF
          fi

          cat >> release-notes.md <<EOF

          ### Assets / 附件

          - \\`update-manifest.json\\` is attached to this release and used by one-click update.
          - 本 Release 已附带 \\`update-manifest.json\\`，用于一键更新流程。
          EOF

      - name: Create/update GitHub release and upload manifest
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: ${{ needs.prepare.outputs.tag }}
          draft: false
          prerelease: ${{ needs.prepare.outputs.channel != 'stable' }}
          body_path: release-notes.md
          files: update-manifest.json
          overwrite_files: true

services:
  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_DB=alloy
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    # Intentionally not published to host. Access it via the compose network.
    volumes:
      - alloy-postgres:/var/lib/postgresql/data
    restart: unless-stopped

  alloy-agent:
    image: ${ALLOY_IMAGE_REPO_PREFIX:-ghcr.io/ign1x}/alloy-agent:${ALLOY_IMAGE_TAG:-latest}
    # Use host networking so game servers can bind arbitrary ports without
    # needing explicit `ports:` mappings (best for multi-game + dynamic ports).
    #
    # NOTE: `network_mode: host` is Linux-only. On macOS/Windows, use bridge
    # networking and explicit `ports:` mappings instead.
    network_mode: "host"
    environment:
      - RUST_LOG=info
      - ALLOY_DATA_ROOT=/data
      # Secure-by-default instance sandboxing.
      - ALLOY_SANDBOX_DEFAULT_ENABLED=true
      # auto: prefer docker per-instance containers, then bwrap, then native.
      - ALLOY_SANDBOX_MODE=auto
      - ALLOY_SANDBOX_DOCKER_ENABLED=true
      - ALLOY_SANDBOX_FORCE_MODE=docker
      - ALLOY_SANDBOX_DOCKER_IMAGE=${ALLOY_IMAGE_REPO_PREFIX:-ghcr.io/ign1x}/alloy-agent:${ALLOY_IMAGE_TAG:-latest}
      - ALLOY_SANDBOX_DOCKER_DATA_VOLUME=alloy-agent-data
      # Best-effort cgroup v2 quota enforcement (memory/cpu/pids).
      - ALLOY_SANDBOX_ENABLE_CGROUPS=true
      - ALLOY_SANDBOX_MEMORY_MB_DEFAULT=4096
      - ALLOY_SANDBOX_PIDS_LIMIT_DEFAULT=512
      - ALLOY_SANDBOX_NOFILE_LIMIT_DEFAULT=8192
      - ALLOY_SANDBOX_CPU_MILLICORES_DEFAULT=2000
      # Enable filesystem write operations (mkdir/write/rename/remove) via the agent FS service.
      # Without this, the UI can only browse/read files.
      - ALLOY_FS_WRITE_ENABLED=true
      # Reverse-connect back to the control plane over WebSocket.
      # Route through the web entrypoint so release compose only needs one host port.
      - ALLOY_CONTROL_WS_URL=http://127.0.0.1:10043/agent/ws
      - ALLOY_NODE_NAME=${ALLOY_NODE_NAME:-default}
      # Set this after creating a node in the panel (Nodes -> Create).
      - ALLOY_NODE_TOKEN=${ALLOY_NODE_TOKEN:-}
    volumes:
      - alloy-agent-data:/data
      # Required for per-instance `docker run` sandbox mode.
      - /var/run/docker.sock:/var/run/docker.sock
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    restart: unless-stopped

  alloy-control:
    image: ${ALLOY_IMAGE_REPO_PREFIX:-ghcr.io/ign1x}/alloy-control:${ALLOY_IMAGE_TAG:-latest}
    extra_hosts:
      # Allow reaching the host network (and host-networked alloy-agent) from this container.
      - "host.docker.internal:host-gateway"
    environment:
      - RUST_LOG=info
      # Release compose defaults to reverse tunnel only; create nodes manually in the panel.
      - ALLOY_AGENT_TRANSPORT=tunnel
      - DATABASE_URL=postgres://postgres:postgres@postgres:5432/alloy
      # Required auth config for control startup.
      - ALLOY_JWT_SECRET=${ALLOY_JWT_SECRET:?set ALLOY_JWT_SECRET in .env}
      # Required only on first boot when users table is empty.
      - ALLOY_ADMIN_USER=${ALLOY_ADMIN_USER:-}
      - ALLOY_ADMIN_PASS=${ALLOY_ADMIN_PASS:-}
      # Used by CSRF/Origin middleware for browser requests.
      - ALLOY_ALLOWED_ORIGINS=http://localhost:10043,http://127.0.0.1:10043,http://localhost:5173,http://127.0.0.1:5173
      # One-click updates (optional): control triggers Watchtower's HTTP API.
      - ALLOY_UPDATE_WATCHTOWER_URL=http://watchtower:8080
      - ALLOY_UPDATE_WATCHTOWER_TOKEN=${ALLOY_WATCHTOWER_TOKEN:-}
      # Optional update manifest for component-specific versions (control/agent).
      - ALLOY_UPDATE_MANIFEST_URL=${ALLOY_UPDATE_MANIFEST_URL:-https://github.com/Ign1x/Alloy/releases/latest/download/update-manifest.json}
    depends_on:
      - postgres
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    restart: unless-stopped

  web:
    image: ${ALLOY_IMAGE_REPO_PREFIX:-ghcr.io/ign1x}/alloy-web:${ALLOY_IMAGE_TAG:-latest}
    ports:
      - "10043:80"
    depends_on:
      - alloy-control
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    restart: unless-stopped

  watchtower:
    # This is a fork that is actively maintained (unlike `containrrr/watchtower`).
    image: nickfedor/watchtower:latest
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      # Only update containers with the `com.centurylinklabs.watchtower.enable=true` label.
      - WATCHTOWER_LABEL_ENABLE=true
      # Enable HTTP API mode (updates are triggered via `/v1/update`).
      - WATCHTOWER_HTTP_API_UPDATE=true
      - WATCHTOWER_HTTP_API_TOKEN=${ALLOY_WATCHTOWER_TOKEN:-}
      # Optional: remove old images after updating to save disk.
      - WATCHTOWER_CLEANUP=true
    labels:
      - "com.centurylinklabs.watchtower.enable=false"
    restart: unless-stopped

volumes:
  alloy-agent-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./alloy-agent-data
  alloy-postgres:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./alloy-postgres

syntax = "proto3";

package alloy.agent.v1;

// Minimal agent health API.
service AgentHealthService {
  rpc Check(HealthCheckRequest) returns (HealthCheckResponse);
}

// AgentUpdateService handles self-updates of the alloy-agent container.
//
// Intended for remote node management where control can only reach the node
// through the reverse tunnel.
service AgentUpdateService {
  rpc GetSelfUpdateStatus(GetSelfUpdateStatusRequest) returns (GetSelfUpdateStatusResponse);
  rpc TriggerSelfUpdate(TriggerSelfUpdateRequest) returns (TriggerSelfUpdateResponse);
}

message HealthCheckRequest {}

message GetSelfUpdateStatusRequest {}

message GetSelfUpdateStatusResponse {
  bool configured = 1;
  string provider = 2;
  string endpoint = 3;
}

message TriggerSelfUpdateRequest {}

message TriggerSelfUpdateResponse {
  bool ok = 1;
  string message = 2;
}

message PortAvailability {
  uint32 port = 1;
  bool available = 2;
  string error = 3;
}

message HealthCheckResponse {
  string status = 1;
  string agent_version = 2;
  // Absolute path of the agent data root.
  string data_root = 3;
  // Best-effort: whether data_root appears writable.
  bool data_root_writable = 4;
  // Best-effort free bytes at data_root filesystem.
  uint64 data_root_free_bytes = 5;
  // Best-effort TCP port availability checks (server-selected list).
  repeated PortAvailability ports = 6;
  string public_ipv4 = 7;
  string private_ipv4 = 8;
  uint32 cpu_percent_x100 = 9;
  uint64 memory_used_bytes = 10;
  uint64 memory_total_bytes = 11;
  uint64 network_rx_bytes_per_sec = 12;
  uint64 network_tx_bytes_per_sec = 13;
  uint64 disk_read_bytes_per_sec = 14;
  uint64 disk_write_bytes_per_sec = 15;
}
